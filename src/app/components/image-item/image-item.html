<div class="image-container relative group border p-2 rounded-lg bg-white shadow-sm">
  
  <img 
    [ngSrc]="imageData().src" 
    [alt]="imageData().alt" 
    width="300" 
    height="200" 
    class="w-full h-auto object-cover rounded" />

  <button 
    (click)="onDeleteClick($event)" 
    class="absolute top-2 right-2 bg-red-600 text-white p-2 rounded-full hover:bg-red-700 transition-colors shadow-md">
    🗑️ Borrar
  </button>
  
</div>
